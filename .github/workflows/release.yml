name: Publicar atualizacao

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Preparar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Compilar e montar pacote incremental
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet build .\Launcher\XMEyeCloudTester.Launcher.csproj -c Release -p:Version=$version -p:AssemblyVersion="$version.0" -p:FileVersion="$version.0"
          dotnet build .\XMEyeCloudTester.csproj -c Release -p:Version=$version -p:AssemblyVersion="$version.0" -p:FileVersion="$version.0"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /c "`"$vcvars`" >nul && cl /nologo /EHsc /LD /O2 .\NativeBridge\xmeye_bridge.cpp /link /OUT:.\XMEyeBridge.dll"
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao compilar XMEyeBridge.dll' }
          New-Item -ItemType Directory -Path .\release-patch | Out-Null
          Copy-Item .\Launcher\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.exe .\release-patch\
          Copy-Item .\Launcher\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.dll .\release-patch\
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.exe .\release-patch\
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.dll .\release-patch\
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.deps.json .\release-patch\
          Copy-Item .\bin\Release\net8.0-windows\win-x64\QRCoder.dll .\release-patch\
          Copy-Item .\XMEyeBridge.dll .\release-patch\
          Copy-Item .\CloudServer .\release-patch\
          Copy-Item .\COMO_TESTAR.txt .\release-patch\
          Copy-Item .\LEIA-ME.md .\release-patch\
          # Compatibilidade de uma unica versao com o instalador antigo, que
          # removia o primeiro caractere de cada caminho ao copiar os arquivos.
          Copy-Item .\Launcher\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.exe '.\release-patch\!XMEyeCloudTester.exe'
          Copy-Item .\Launcher\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.dll '.\release-patch\!XMEyeCloudTester.dll'
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.exe '.\release-patch\!XMEyeCloudTester.App.exe'
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.dll '.\release-patch\!XMEyeCloudTester.App.dll'
          Copy-Item .\bin\Release\net8.0-windows\win-x64\XMEyeCloudTester.App.deps.json '.\release-patch\!XMEyeCloudTester.App.deps.json'
          Copy-Item .\bin\Release\net8.0-windows\win-x64\QRCoder.dll '.\release-patch\!QRCoder.dll'
          Copy-Item .\XMEyeBridge.dll '.\release-patch\!XMEyeBridge.dll'
          Copy-Item .\CloudServer '.\release-patch\!CloudServer'
          Compress-Archive -Path .\release-patch\* -DestinationPath .\XMEyeCloudTester-update.zip

      - name: Criar Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" .\XMEyeCloudTester-update.zip --generate-notes --title "XMEye Cloud Tester ${{ github.ref_name }}"
